<!DOCTYPE html> <!-- Declare this document as HTML5 -->
<html lang="en"> <!-- Start of HTML with English language -->
<head>
  <meta charset="UTF-8"> <!-- Set character encoding -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobile responsiveness -->
  <title>Canvas Drawing App</title> <!-- Page title -->

  <style>
    body {
      font-family: Arial, sans-serif; // Set default font
      text-align: center; // Center align content
      padding: 20px; // Add padding around the body
    }

    canvas {
      border: 2px solid #000; // Add a border to canvas
      width: 90vw; // Set canvas width to 90% of the screen
      height: 60vh; // Set canvas height to 60% of the screen
    }

    button {
      margin: 10px; // Space around buttons
      padding: 10px 20px; // Inside button spacing
      font-size: 1em; // Set readable font size
    }
  </style>
</head>

<body>

  <h1>Canvas Drawing App</h1> <!-- Main heading -->

  <canvas id="myCanvas" width="360" height="240"></canvas> <!-- Drawing canvas -->

  <div>
    <button onclick="drawRectangle()">Draw Rectangle</button> <!-- Button to draw a rectangle -->
    <button onclick="addName()">Add Name</button> <!-- Button to write your name -->
    <button onclick="loadImage()">Load Image</button> <!-- Button to load an image -->
    <button onclick="clearCanvas()">Clear Canvas</button> <!-- Button to clear canvas -->
  </div>

  <script>
    const canvas = document.getElementById('myCanvas'); // Get canvas element
    const ctx = canvas.getContext('2d'); // Get 2D drawing context

    function drawRectangle() {
      ctx.fillStyle = 'blue'; // Set rectangle color
      ctx.fillRect(50, 50, 150, 100); // Draw blue rectangle
    }

    function addName() {
      ctx.fillStyle = 'black'; // Set text color
      ctx.font = '20px Arial'; // Set font size and style
      ctx.fillText('Amaris Asamoah', 90, 220); // Write name
    }

    function loadImage() {
      const img = new Image(); // Create new image object
      img.onload = function () {
        ctx.drawImage(img, 120, 60, 100, 100); // Draw image on canvas
      };
      img.src = 'sample.png'; // Image must be in your repo
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas area
    }

    const docMod = document.lastModified; // Check last modified time
    alert("This file last modified " + docMod); // Alert it
    console.log("This file last modified " + docMod); // Log to console
  </script>

</body>
</html>
